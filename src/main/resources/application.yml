spring:
  application:
    name: stock-tracker-api
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/stocktracker
    username: stocktracker
    password: ${DB_PASSWORD:stocktracker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cache:
    type: caffeine

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

# ===== Custom properties =====
app:
  finnhub:
    api-key: ${FINNHUB_API_KEY}
    base-url: https://finnhub.io/api/v1
    ws-url: wss://ws.finnhub.io

  twelve-data:
    api-key: ${TWELVE_DATA_API_KEY}
    base-url: https://api.twelvedata.com

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 604800000   # 7 days

  cors:
    allowed-origins:
      - http://localhost:4200
      - https://xfre32.github.io

  rate-limit:
    capacity: 60
    refill-tokens: 60
    refill-duration: 60   # seconds