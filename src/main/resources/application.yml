spring:
  application:
    name: stock-tracker-api

  datasource:
    url: jdbc:postgresql://localhost:5432/stocktracker
    username: stocktracker
    password: ${DB_PASSWORD:stocktracker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cache:
    type: caffeine

  jackson:
    default-property-inclusion: non_null
  web:
    error:
      include-message: always

server:
  port: 8080

# ===== Custom properties =====
app:
  finnhub:
    api-key: ${FINNHUB_API_KEY}
    base-url: https://finnhub.io/api/v1
    ws-url: wss://ws.finnhub.io

  twelve-data:
    api-key: ${TWELVE_DATA_API_KEY}
    base-url: https://api.twelvedata.com

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 604800000   # 7 days

  cors:
    allowed-origins:
      - http://localhost:4200
      - https://xfre32.github.io

  rate-limit:
    capacity: 60
    refill-tokens: 60
    refill-duration: 60   # seconds
    bucket-ttl-seconds: 3600
    max-buckets: 10000

  external-api:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    write-timeout-ms: 5000
    response-timeout-ms: 6000
